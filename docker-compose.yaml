services:
  postiz:
    # Built from YOUR fork, not the stock Postiz image — see DEPLOY.md step 2.
    # Example: ghcr.io/YOUR-GITHUB-USERNAME/samyag-scheduler:latest
    image: 'REPLACE_ME/samyag-scheduler:latest'
    container_name: postiz
    restart: always
    environment:
      # === Required — replace these with your real domain ===
      # (e.g. schedule.samyagsynergy.com — this will be a Cloudflare-fronted
      # address, see DEPLOY.md step 5; there is no need to point this at a
      # raw server IP)
      MAIN_URL: 'https://REPLACE_WITH_YOUR_DOMAIN'
      FRONTEND_URL: 'https://REPLACE_WITH_YOUR_DOMAIN'
      NEXT_PUBLIC_BACKEND_URL: 'https://REPLACE_WITH_YOUR_DOMAIN/api'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'

      # Real random secret, already generated for you — do not reuse this
      # exact value if you ever fork this again; generate a fresh one with:
      # openssl rand -hex 32
      JWT_SECRET: '71631aa51bcd839f4284538f3a0cd20e641bb3060a15797d9585f015dc69dbf6'

      DATABASE_URL: 'postgresql://postiz-user:8da837382703eb1c60ddb9f2f82120151062fd91@postiz-postgres:5432/postiz-db-local'
      REDIS_URL: 'redis://postiz-redis:6379'
      TEMPORAL_ADDRESS: 'temporal:7233'
      IS_GENERAL: 'true'

      # PERSONAL-USE PHASE: only the very first account to sign up is
      # allowed to register — everyone after that is blocked. This lets
      # you test with your own accounts right now, safely, before you're
      # ready for strangers. Verified directly in Postiz's own auth code
      # (see SECURITY.md). Flip to 'false' only when you're ready to open
      # this to the public.
      DISABLE_REGISTRATION: 'true'

      # === Free-tier limits — change these anytime, then just restart the
      # container (docker compose up -d) — no rebuild needed. ===
      FREE_TIER_POSTS_PER_MONTH: 31
      FREE_TIER_CHANNELS: 10

      # === Storage ===
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

      # === The 4 platforms — fill each in after registering a developer app (DEPLOY.md step 4) ===
      # X (Twitter) intentionally left out — see CHANGES.md for why.
      LINKEDIN_CLIENT_ID: 'REPLACE_ME'
      LINKEDIN_CLIENT_SECRET: 'REPLACE_ME'
      # Instagram rides on the same Facebook app credentials — one app, both platforms
      FACEBOOK_APP_ID: 'REPLACE_ME'
      FACEBOOK_APP_SECRET: 'REPLACE_ME'
      YOUTUBE_CLIENT_ID: 'REPLACE_ME'
      YOUTUBE_CLIENT_SECRET: 'REPLACE_ME'

      # === Turns on Postiz's own free-tier limit system (31 posts/month) ===
      # This is NOT a real Stripe account — Postiz's own code already falls
      # back to a harmless placeholder ('sk_nothing') if left blank, but we
      # set explicit placeholders here so it's clear nothing is being billed.
      # See SECURITY.md for the exact line of Postiz source this refers to.
      STRIPE_PUBLISHABLE_KEY: 'pk_placeholder_no_real_account'
      STRIPE_SECRET_KEY: 'sk_placeholder_no_real_account'
      STRIPE_SIGNING_KEY: ''
      FEE_AMOUNT: 0

      NX_ADD_PLUGINS: false
    # Exposed on the standard web port. Cloudflare's proxy (the orange-cloud
    # DNS record you already use for your main site) sits in front of this
    # and provides free HTTPS automatically — no extra tunnel software
    # needed. See DEPLOY.md step 3.
    ports:
      - '80:5000'
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    networks:
      - postiz-network
      - temporal-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: '8da837382703eb1c60ddb9f2f82120151062fd91'
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 3

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  # --- Temporal: the scheduling engine Postiz runs on. Required, do not remove. ---
  # None of these need a published host port — Postiz talks to "temporal:7233"
  # over the internal Docker network by name, not through the host machine.
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - /var/lib/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: '8b85672acadbb42cb167708c6d9d5343a8b7c27e'
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.28.1
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=8b85672acadbb42cb167708c6d9d5343a8b7c27e
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      - temporal
    tty: true

volumes:
  postgres-volume:
    external: false
  postiz-redis-data:
    external: false
  postiz-config:
    external: false
  postiz-uploads:
    external: false

networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
